[project]
name = "ble-link-watch"
version = "0.1.0"
description = "See which apps on an Android phone connect to, hold, and read a Bluetooth LE peripheral"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
peripheral = ["dbus-next>=0.2.3"]

[project.scripts]
linkwatch = "linkwatch.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkwatch"]

[tool.ruff]
line-length = 110
